<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background -->
  <rect width="32" height="32" rx="6" fill="#1a1a2e"/>

  <!-- 3D cube outline (isometric-ish) -->
  <!-- Top face -->
  <polygon points="16,3 27,8.5 16,14 5,8.5" fill="#16213e" stroke="#4fc3f7" stroke-width="0.8"/>
  <!-- Left face -->
  <polygon points="5,8.5 16,14 16,25 5,19.5" fill="#0f3460" stroke="#4fc3f7" stroke-width="0.8"/>
  <!-- Right face -->
  <polygon points="27,8.5 16,14 16,25 27,19.5" fill="#162447" stroke="#4fc3f7" stroke-width="0.8"/>

  <!-- X on the top face (cyan) -->
  <line x1="11" y1="6.5" x2="15" y2="10" stroke="#4fc3f7" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="15" y1="6.5" x2="11" y2="10" stroke="#4fc3f7" stroke-width="1.6" stroke-linecap="round"/>

  <!-- O on the right face (pink) -->
  <ellipse cx="23" cy="17.5" rx="2.5" ry="2.2" fill="none" stroke="#f48fb1" stroke-width="1.5"/>

  <!-- Grid lines on left face -->
  <line x1="8.5" y1="13" x2="13" y2="15.5" stroke="#4fc3f7" stroke-width="0.5" stroke-opacity="0.5"/>
  <line x1="8.5" y1="17" x2="13" y2="19.5" stroke="#4fc3f7" stroke-width="0.5" stroke-opacity="0.5"/>
  <line x1="8" y1="12" x2="8" y2="22" stroke="#4fc3f7" stroke-width="0.5" stroke-opacity="0.5"/>
  <line x1="12" y1="14" x2="12" y2="24" stroke="#4fc3f7" stroke-width="0.5" stroke-opacity="0.5"/>
</svg>
